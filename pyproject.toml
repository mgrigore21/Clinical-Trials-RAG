[project]
name = "clinical-trials-rag"
version = "0.1.0"
description = "A learning-first RAG assistant over public ClinicalTrials.gov data, runnable locally and on AWS."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.3",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: classic errors, I: import sorting, B: common bugs, UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs a running Postgres (docker compose up -d postgres)",
]
