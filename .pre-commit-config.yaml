# Checks that run automatically on every `git commit`. See docs/01-setup.md.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"] # keeps downloaded trial data out of git
      - id: detect-private-key

  # Ruff runs from our own uv environment (repo: local), so the version used by
  # pre-commit is always the one pinned in uv.lock — no second version to keep in sync.
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
